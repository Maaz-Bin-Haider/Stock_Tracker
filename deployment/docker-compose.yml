name: stock-tracker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_tracker
      POSTGRES_USER: stock_tracker
      POSTGRES_PASSWORD: stock_tracker
    ports:
      # 5433 on the host: avoids colliding with a natively installed Postgres.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../src/backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../src/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../src/backend
    command: celery -A config worker --loglevel=info
    environment: *backend-env
    volumes:
      - ../src/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../src/frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../src/frontend:/app
      - frontend_node_modules:/app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../src/backend/media:/srv/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  frontend_node_modules:
