name: stock-tracker-prod

# Offline / local production stack (Phase M9). Runs the app in production mode on
# a single machine or office LAN with no cloud dependency:
#   - gunicorn (not runserver), Next.js production build (not `next dev`)
#   - persistent named volumes for DB / media / exports / static
#   - restart: unless-stopped so the stack survives a reboot
#   - a backup sidecar that runs pg_dump on a schedule to ./data/backups
#
# Config comes from deployment/.env.prod (copy from deployment/env.prod.example).
# Start with:  make prod-up   (or: docker compose -f deployment/docker-compose.prod.yml --env-file deployment/.env.prod up -d --build)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-stock_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deployment/.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately NOT published to the host/LAN: the DB stays internal to the stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../src/backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.local_prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in deployment/.env.prod}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
      POSTGRES_DB: ${POSTGRES_DB:-stock_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-stock_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deployment/.env.prod}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_files:/app/media
      - exports_data:/app/exports
      - static_files:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build: ../src/backend
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment: *backend-env
    volumes:
      - media_files:/app/media
      - exports_data:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/srv/media:ro
      - static_files:/srv/static:ro
    depends_on:
      - backend
      - frontend

  # Backup sidecar: dumps the DB to ./data/backups on a schedule and prunes old
  # dumps. Uses the same postgres image so pg_dump matches the server version.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-stock_tracker}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deployment/.env.prod}
      PGDATABASE: ${POSTGRES_DB:-stock_tracker}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-43200}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-120}
    volumes:
      - ../data/backups:/backups
      - media_files:/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo "Backup sidecar: every ${BACKUP_INTERVAL_SECONDS:-43200}s, keep ${BACKUP_RETENTION_DAYS:-120} days, into /backups"
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          out="/backups/stock_tracker-$$ts.sql.gz"
          media_out="/backups/stock_tracker-media-$$ts.tar.gz"
          tmp="/tmp/stock_tracker-$$ts.sql"
          db_ok=0
          echo "[backup] $$ts -> $$out"
          if pg_dump --clean --if-exists --file="$$tmp" &&
             gzip -c "$$tmp" > "$$out" &&
             gzip -t "$$out"; then
            echo "[backup] ok: $$out ($$(du -h "$$out" | cut -f1))"
            db_ok=1
          else
            echo "[backup] FAILED: $$out"; rm -f "$$out"
          fi
          rm -f "$$tmp"
          if [ "$$db_ok" -eq 1 ]; then
            echo "[backup] media -> $$media_out"
            if tar -czf "$$media_out" -C /media . && tar -tzf "$$media_out" >/dev/null; then
              echo "[backup] media ok: $$media_out ($$(du -h "$$media_out" | cut -f1))"
            else
              echo "[backup] media FAILED: $$media_out"; rm -f "$$media_out"
            fi
          else
            echo "[backup] media skipped because the database dump failed"
          fi
          find /backups -name 'stock_tracker-*.sql.gz' -type f -mtime +${BACKUP_RETENTION_DAYS:-120} -delete
          find /backups -name 'stock_tracker-media-*.tar.gz' -type f -mtime +${BACKUP_RETENTION_DAYS:-120} -delete
          sleep ${BACKUP_INTERVAL_SECONDS:-43200}
        done

volumes:
  postgres_data:
  media_files:
  exports_data:
  static_files:
