# Single origin for frontend + API (TECHNICAL_ARCHITECTURE §1): keeps session
# cookies simple and avoids CORS entirely.

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin static assets (served by runserver in dev).
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Dev uploads served straight from the backend media volume (FR-105).
    location /media/ {
        alias /srv/media/;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        # Websocket upgrade for Next.js HMR in dev.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
