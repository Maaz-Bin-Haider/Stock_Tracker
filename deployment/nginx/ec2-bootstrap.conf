# Temporary HTTP-only configuration used solely while Certbot proves control of
# the Elastic IP. setup-ec2.sh replaces it with ec2-https.conf after issuance.

server_tokens off;

server {
    listen 80;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "HTTPS certificate provisioning is in progress.\n";
        add_header Content-Type text/plain;
    }
}
