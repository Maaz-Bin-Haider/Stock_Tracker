# Offline / local production nginx (Phase M9). Single origin for frontend + API
# so session cookies stay simple and there is no CORS. Unlike the dev config,
# gunicorn does NOT serve static files, so nginx serves collected Django static
# assets and uploaded media directly from shared volumes.

# Canonical websocket upgrade mapping (empty Connection when not upgrading).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    # Uploads are capped at 10 MB in the app; 25m leaves headroom for form overhead.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Collected Django static (admin + DRF assets), written by `collectstatic`
    # into the shared static_files volume on backend startup.
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
    }

    # Uploaded invoice/attachment files (FR-105). Report exports are NOT served
    # here — they stay private in EXPORTS_ROOT and download only via the API.
    location /media/ {
        alias /srv/media/;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
