[project]
name = "stock-tracker-backend"
version = "0.1.0"
description = "SwissTech Stock Tracker backend (Django + DRF)"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.5",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.11",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated by Django; not hand-maintained.
"**/migrations/*" = ["E501", "I"]
